<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient - Terra Cotta to warm orange -->
    <linearGradient id="bridgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8722A"/>
      <stop offset="50%" stop-color="#D4622A"/>
      <stop offset="100%" stop-color="#B8521F"/>
    </linearGradient>
    
    <!-- Jade accent gradient -->
    <linearGradient id="jadeGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D9D78"/>
      <stop offset="100%" stop-color="#3DB88A"/>
    </linearGradient>
    
    <!-- Glow filter for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1C0E06" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle with cream color -->
  <circle cx="256" cy="256" r="240" fill="#F5EDE0"/>
  
  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#E8D4BC" stroke-width="2"/>
  
  <!-- The "Setu" Bridge Symbol - Two flowing paths connecting -->
  <g filter="url(#shadow)">
    <!-- Left arc - representing one side/community -->
    <path 
      d="M 120 320 
         Q 120 180, 220 140
         Q 256 128, 256 128"
      fill="none" 
      stroke="url(#bridgeGradient)" 
      stroke-width="44" 
      stroke-linecap="round"
    />
    
    <!-- Right arc - representing other side/community -->
    <path 
      d="M 392 320 
         Q 392 180, 292 140
         Q 256 128, 256 128"
      fill="none" 
      stroke="url(#bridgeGradient)" 
      stroke-width="44" 
      stroke-linecap="round"
    />
  </g>
  
  <!-- Connection point - the "bridge" meeting point with jade accent -->
  <circle cx="256" cy="128" r="32" fill="url(#jadeGradient)" filter="url(#glow)"/>
  
  <!-- Inner highlight on connection point -->
  <circle cx="250" cy="122" r="12" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Small jade dots at the base - representing people/communities -->
  <circle cx="120" cy="340" r="18" fill="url(#jadeGradient)" opacity="0.8"/>
  <circle cx="392" cy="340" r="18" fill="url(#jadeGradient)" opacity="0.8"/>
  
  <!-- Subtle decorative arcs showing "ripple of impact" -->
  <path 
    d="M 180 380 Q 256 420, 332 380"
    fill="none" 
    stroke="#D4622A" 
    stroke-width="3" 
    stroke-linecap="round"
    opacity="0.3"
  />
  <path 
    d="M 150 410 Q 256 460, 362 410"
    fill="none" 
    stroke="#D4622A" 
    stroke-width="2" 
    stroke-linecap="round"
    opacity="0.2"
  />
</svg>
